--- 

- name: Install MARIADB on UBUNTU AND CENTOS  (ansible managed by beatrice)
  hosts: all
  become: true

  tasks:

    - name: Install MariaDB on UBuntu
      ansible.builtin.apt:
       name: mariadb-server
       state: present
       update_cache: true
      when: ansible_os_family == "Debian"

    - name: Install  Mariadb on CentOS
      ansible.builtin.dnf:
       name: mariadb-server
       state: present
      when: ansible_os_family == "RedHat"

    - name: start and enable mariadb on both servers
      ansible.builtin.service:
       name: mariadb
       state: started
       enabled: true


